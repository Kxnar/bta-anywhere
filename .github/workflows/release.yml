name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  relay:
    name: Relay ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: bta-anywhere-relay-linux-x86_64
            executable: bta-anywhere-relay
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: bta-anywhere-relay-windows-x86_64.exe
            executable: bta-anywhere-relay.exe
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: bta-anywhere-relay-macos-x86_64
            executable: bta-anywhere-relay
          - os: macos-15
            target: aarch64-apple-darwin
            asset: bta-anywhere-relay-macos-aarch64
            executable: bta-anywhere-relay
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Audit attribution
        shell: bash
        run: |
          if git log --format='%B' | grep -Eiq 'co-authored-by:.*(codex|openai)|generated by (codex|an ai)|authored by codex'; then
            exit 1
          fi
      - name: Install Rust 1.85 target
        shell: bash
        run: |
          rustup toolchain install 1.85.0 --profile minimal --target '${{ matrix.target }}'
          rustup default 1.85.0
      - name: Build and test relay
        shell: bash
        run: |
          cargo test --locked --all
          cargo build --locked --release --package bta-anywhere-relay --target '${{ matrix.target }}'
          mkdir -p dist
          cp 'target/${{ matrix.target }}/release/${{ matrix.executable }}' 'dist/${{ matrix.asset }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: relay-${{ matrix.target }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  java:
    name: Java release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build and test JARs
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean check build
          java -jar tunnel-client/build/libs/bta-anywhere-tunnel-0.1.0-all.jar doctor
          mkdir -p dist
          cp bta-mod/build/libs/bta-anywhere-0.1.0+bta8.0.1.jar dist/
          cp tunnel-client/build/libs/bta-anywhere-tunnel-0.1.0-all.jar dist/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: java-artifacts
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [relay, java]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: downloaded
      - name: Assemble checksummed release
        shell: bash
        run: |
          mkdir -p dist
          find downloaded -maxdepth 3 -type f -exec cp {} dist/ \;
          cp LICENSE THIRD_PARTY_NOTICES.md dist/
          python3 scripts/check_rust_licenses.py \
            --output dist/RUST_DEPENDENCIES.md \
            --notices-output dist/RUST_DEPENDENCY_NOTICES.txt
          cd dist
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS
      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
          files: dist/*
