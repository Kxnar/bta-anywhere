name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  relay:
    name: Windows x86-64 relay
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Audit attribution
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\audit-attribution.ps1
      - name: Install Rust 1.85
        shell: pwsh
        run: |
          rustup toolchain install 1.85.0 --profile minimal --target x86_64-pc-windows-msvc
          rustup default 1.85.0
      - name: Build and test relay
        shell: pwsh
        run: |
          cargo test --locked --all
          cargo build --locked --release --package bta-anywhere-relay --target x86_64-pc-windows-msvc
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target\x86_64-pc-windows-msvc\release\bta-anywhere-relay.exe dist\bta-anywhere-relay-windows-x86_64.exe
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: relay-windows-x86_64
          path: dist/bta-anywhere-relay-windows-x86_64.exe
          if-no-files-found: error

  java:
    name: Windows Java release artifacts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build and test JARs
        shell: pwsh
        run: |
          .\gradlew.bat --no-daemon clean check build
          java -jar tunnel-client\build\libs\bta-anywhere-tunnel-0.1.0-all.jar doctor
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item bta-mod\build\libs\bta-anywhere-0.1.0+bta8.0.1.jar dist\
          Copy-Item tunnel-client\build\libs\bta-anywhere-tunnel-0.1.0-all.jar dist\
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: java-artifacts
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [relay, java]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: downloaded
      - name: Assemble checksummed release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Get-ChildItem downloaded -Recurse -File | Copy-Item -Destination dist
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md -Destination dist
          python scripts\check_rust_licenses.py `
            --output dist\RUST_DEPENDENCIES.md `
            --notices-output dist\RUST_DEPENDENCY_NOTICES.txt
          $checksumLines = Get-ChildItem dist -File |
            Where-Object Name -ne 'SHA256SUMS' |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            }
          Set-Content -LiteralPath dist\SHA256SUMS -Encoding ascii -Value $checksumLines
      - name: Publish release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
          files: dist/*
