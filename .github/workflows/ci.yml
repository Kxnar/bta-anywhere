name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  attribution:
    name: Attribution audit
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Reject agent authorship trailers
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\audit-attribution.ps1

  rust:
    name: Rust relay (Windows x86-64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Rust 1.85
        shell: pwsh
        run: |
          rustup toolchain install 1.85.0 --profile minimal --component clippy,rustfmt
          rustup default 1.85.0
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check dependency licences
        run: python scripts\check_rust_licenses.py
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --all

  java:
    name: Java and native QUIC (Windows x86-64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      - name: Build and test
        shell: pwsh
        run: .\gradlew.bat --no-daemon check build
      - name: Load shaded native QUIC transport
        shell: pwsh
        run: java -jar tunnel-client\build\libs\bta-anywhere-tunnel-0.1.0-all.jar doctor

  integration:
    name: Windows relay-to-tunnel integration
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install Rust 1.85
        shell: pwsh
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          rustup default 1.85.0
      - name: Build integration artifacts
        shell: pwsh
        run: |
          cargo build --locked --release --package bta-anywhere-relay
          .\gradlew.bat --no-daemon :tunnel-client:shadowJar
      - name: Run concurrent byte-exact integration test
        shell: pwsh
        run: |
          python scripts\cross_language_e2e.py `
            --relay-binary target\release\bta-anywhere-relay.exe `
            --tunnel-jar tunnel-client\build\libs\bta-anywhere-tunnel-0.1.0-all.jar `
            --java "$env:JAVA_HOME\bin\java.exe" `
            --concurrency-waves 100
      - name: Run serial Windows half-close smoke test
        shell: pwsh
        run: |
          python scripts\windows_half_close_smoke.py `
            --relay-binary target\release\bta-anywhere-relay.exe `
            --tunnel-jar tunnel-client\build\libs\bta-anywhere-tunnel-0.1.0-all.jar `
            --java "$env:JAVA_HOME\bin\java.exe" `
            --iterations 100 `
            --event-loop-threads 1
      - name: Test benchmark reporting
        shell: pwsh
        run: python -m unittest discover -s scripts -p test_benchmark_relay.py
      - name: Run short direct and relay benchmark smoke
        shell: pwsh
        run: |
          python scripts\benchmark_relay.py --profile smoke `
            --relay-binary target\release\bta-anywhere-relay.exe `
            --tunnel-jar tunnel-client\build\libs\bta-anywhere-tunnel-0.1.0-all.jar `
            --java "$env:JAVA_HOME\bin\java.exe" `
            --output benchmark-results\ci-smoke.json
