name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  attribution:
    name: Attribution audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Reject agent authorship trailers
        shell: bash
        run: |
          if git log --format='%B' | grep -Eiq 'co-authored-by:.*(codex|openai)|generated by (codex|an ai)|authored by codex'; then
            echo 'Forbidden agent authorship text is present in commit history.' >&2
            exit 1
          fi
          git log --format=fuller --max-count=20

  rust:
    name: Rust relay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install Rust 1.85
        shell: bash
        run: |
          rustup toolchain install 1.85.0 --profile minimal --component clippy,rustfmt
          rustup default 1.85.0
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check dependency licences
        run: python3 scripts/check_rust_licenses.py
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --all

  java:
    name: Java and native QUIC (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Build and test
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon check build
      - name: Load shaded native QUIC transport
        shell: bash
        run: java -jar tunnel-client/build/libs/bta-anywhere-tunnel-0.1.0-all.jar doctor

  integration:
    name: Rust relay to Java tunnel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install Rust 1.85
        shell: bash
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          rustup default 1.85.0
      - name: Build integration artifacts
        shell: bash
        run: |
          cargo build --locked --release --package bta-anywhere-relay
          chmod +x gradlew
          ./gradlew --no-daemon :tunnel-client:shadowJar
      - name: Run byte-exact cross-language test
        run: >-
          python3 scripts/cross_language_e2e.py
          --relay-binary target/release/bta-anywhere-relay
          --tunnel-jar tunnel-client/build/libs/bta-anywhere-tunnel-0.1.0-all.jar
